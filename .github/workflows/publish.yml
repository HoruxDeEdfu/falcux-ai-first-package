# Publica @falcux/ai-first en npm cuando `prod` avanza con una versión que el
# registro todavía no tiene (ADR-007, ADR-024; spec en docs/specs/publicacion.md).
#
# Publicar es irreversible —npm no deja reutilizar un número—, así que toda duda
# cierra: si la suite, el detector, el registro o el CHANGELOG no responden lo
# esperado, no se publica.
#
# Se autentica por trusted publishing (OIDC): no hay token en el repo. Lo
# configura Charlie en npmjs.com para este repo y este archivo. Si falta, el
# paso de publicar falla con 404 y no sale nada.
name: publish

on:
  push:
    branches: [prod]

permissions:
  contents: read
  id-token: write

# Dos pushes seguidos a `prod` se publican en fila, nunca a la vez.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # El detector audita el rango que se publica, y el paso del tag lee
          # los tags: los dos necesitan la historia entera.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing exige npm 11.5.1 o superior; Node 22 trae npm 10.
      # Se compila con pnpm y se publica con npm porque pnpm 10 no habla OIDC.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Entropía documental del rango que se publica
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "El push crea la rama: no hay rango que auditar."
            exit 0
          fi
          # Con una base que no existe, git no da rango y el detector no
          # encontraría nada que cobrar. Eso sería aprobar sin medir.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::La base $BASE no está en la historia (¿push forzado?). No se publica sin auditar."
            exit 1
          fi
          node dist/src/cli.js audit --base "$BASE" --estricto

      - name: ¿La versión es nueva?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # La lista entera y no sólo `latest`: una versión con tag que nunca
          # llegó al registro, como la 0.5.0, se tiene que poder publicar.
          # Si el registro no responde, `set -e` corta acá.
          publicadas=$(npm view @falcux/ai-first versions --json)
          if node -e 'const [lista, v] = process.argv.slice(1); process.exit([].concat(JSON.parse(lista)).includes(v) ? 0 : 1)' "$publicadas" "$version"; then
            echo "La $version ya está publicada: nada que hacer."
            echo "nueva=no" >> "$GITHUB_OUTPUT"
          else
            echo "La $version no está en el registro: se publica."
            echo "nueva=si" >> "$GITHUB_OUTPUT"
          fi

      - name: El CHANGELOG cuenta la versión, con fecha
        if: steps.version.outputs.nueva == 'si'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHG-004: la 0.4.0 salió con un CHANGELOG que la daba por no publicada.
          linea=$(grep -E "^## \[${VERSION//./\\.}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || true)
          if [ -z "$linea" ]; then
            echo "::error::CHANGELOG.md no tiene «## [$VERSION] — AAAA-MM-DD»."
            exit 1
          fi
          if echo "$linea" | grep -q "sin publicar"; then
            echo "::error::CHANGELOG.md dice que la $VERSION está sin publicar: $linea"
            exit 1
          fi

      - name: El tag apunta a lo que se publica
        if: steps.version.outputs.nueva == 'si'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHG-015: la 0.5.2 se publicó desde un commit distinto al del tag.
          # El tag lo pone Charlie; acá sólo se avisa.
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::Todavía no hay tag v$VERSION. Va sobre $GITHUB_SHA."
          elif [ "$(git rev-parse "v$VERSION^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::warning::El tag v$VERSION no apunta a $GITHUB_SHA, que es lo que se publica. Hay que moverlo."
          fi

      - name: Publicar
        if: steps.version.outputs.nueva == 'si'
        run: npm publish --access public
